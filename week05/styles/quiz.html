<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario de HTML y CSS</title>
  <meta name="description" content="Cuestionario en linea sobre conceptos basicos de HTML y CSS.">
  <meta name="author" content="Jeniffer">
  <link rel="stylesheet" href="../styles/quiz.css">
</head>
<body>
  <main>
    <h1>Basic HTML and CSS Quiz</h1>

    <form action="#" method="get">
      <div class="form-item">
        <label for="q1"><span>1.</span> What does the acronym CSS stand for?</label>
        <input type="text" id="q1" name="q1" required>
      </div>

      <div class="form-item">
        <label for="q2"><span>2.</span> How are id and class attributes selected in CSS?</label>
        <textarea id="q2" name="q2" rows="5" required></textarea>
      </div>

      <div class="form-item">
        <label for="q3"><span>3.</span> Which of the following is a valid CSS comment?</label>
        <select id="q3" name="q3" required>
          <option value="" selected disabled>Choose One ...</option>
          <option value="html-comment">&lt;!-- comment --&gt;</option>
          <option value="css-comment">/* comment */</option>
          <option value="js-comment">// comment</option>
        </select>
      </div>

      <div class="form-item">
        <label for="q4"><span>4.</span> What is the bottom margin given this declaration?</label>
        <div class="code-example">margin: 10px 5px 15px;</div>
        <input type="number" id="q4" name="q4" min="1" max="10" required>
      </div>

      <button type="submit">Enviar cuestionario</button>
    </form>
  </main>
</body>
</html>
