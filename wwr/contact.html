<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Contact White Water Rafting for trip questions, reservations, directions, and customer support.">
  <meta name="author" content="Jeniffer Carrillo">
  <title>White Water Rafting | Contact Us</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact-page">
  <header>
    <img src="images/rapids-logo.jpeg" alt="Rapids rafting logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>White Water Rafting Company</h1>
    <section class="contact-info">
      <h2>Contact Information</h2>
      <div class="contact-summary">
        <div class="contact-details">
          <p>123 Main River Street</p>
          <p>Kolob, California</p>
          <p>+1 999 999 9999</p>
          <p>info@whitewater.com</p>
        </div>
      </div>
      <div class="contact-grid">
        <iframe
          src="https://www.google.com/maps?q=Kolob%20California&amp;output=embed"
          title="Map showing the White Water Rafting office area"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
        <form>
          <div class="form-row">
            <label for="fullname">Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>
          </div>

          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Placeholder" required>
          </div>

          <fieldset>
            <legend>Message Purpose</legend>
            <label>
              <input type="radio" name="purpose" value="general" required>
              General Inquiry
            </label>
            <label>
              <input type="radio" name="purpose" value="reservation">
              Reservation Question
            </label>
            <label>
              <input type="radio" name="purpose" value="website">
              Website Suggestion
            </label>
          </fieldset>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Type here" required></textarea>

          <label class="checkbox-label" for="newsletter">
            <input type="checkbox" id="newsletter" name="newsletter" checked>
            Please Subscribe me to the monthly newsletter
          </label>

          <button type="submit">Get in Touch!</button>
        </form>
      </div>
    </section>
    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/rafting-hero-unsplash.jpg"
            alt="Maria Lopez leading a rafting crew on the river">
          <figcaption>Maria Lopez, Trip Coordinator</figcaption>
        </figure>
        <figure>
          <img src="images/istock-canoe-splashes.jpg"
            alt="Daniel Reed guiding a guest through river waves">
          <figcaption>Daniel Reed, Lead River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/happy-client.svg" alt="Sofia Carter smiling after a rafting trip">
          <figcaption>Sofia Carter, Customer Support</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 White Water Rafting | Jeniffer Carrillo</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.svg" alt="Facebook">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Instagram">
      </a>
      <a href="https://x.com">
        <img src="images/x-social-media-icon.svg" alt="X">
      </a>
    </nav>
  </footer>
</body>

</html>
